# Local development: Postgres, Redis, MinIO + API, Celery, Next.js.
# Usage (from repo root):  docker compose -f infra/docker-compose.yml up --build
name: doctor-platform-dev

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.dev
  DJANGO_DEBUG: "true"
  DJANGO_ALLOWED_HOSTS: "*"
  DATABASE_URL: postgres://doctor:doctor@postgres:5432/doctor
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  SITE_URL: http://localhost:3000
  API_URL: http://localhost:3000
  CORS_ALLOWED_ORIGINS: http://localhost:3000
  CSRF_TRUSTED_ORIGINS: http://localhost:3000

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: doctor, POSTGRES_USER: doctor, POSTGRES_PASSWORD: doctor }
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U doctor"], interval: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    build: ../backend
    entrypoint: ["sh", "/app/entrypoint.sh"]
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    environment: *backend-env
    volumes: ["../backend:/app"]
    ports: ["8000:8000"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }

  celery-worker:
    build: ../backend
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    environment: *backend-env
    volumes: ["../backend:/app"]
    depends_on: [backend]

  celery-beat:
    build: ../backend
    command: ["celery", "-A", "config", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    environment: *backend-env
    volumes: ["../backend:/app"]
    depends_on: [backend]

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- -H 0.0.0.0"
    environment:
      API_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_DEMO_MODE: "true"
    volumes: ["../frontend:/app", "/app/node_modules"]
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:
