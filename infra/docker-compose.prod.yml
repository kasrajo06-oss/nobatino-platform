# Production / staging stack.  See DEPLOY.md.
#   cd infra && cp .env.example .env   (fill it)  &&  ./scripts/deploy.sh
name: doctor-platform

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.prod
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  DJANGO_ALLOWED_HOSTS: ${DOMAIN},www.${DOMAIN},backend,localhost
  STAGING: ${STAGING:-false}
  BRAND_NAME: ${BRAND_NAME}
  SITE_URL: https://${DOMAIN}
  API_URL: https://${DOMAIN}
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CORS_ALLOWED_ORIGINS: https://${DOMAIN}
  CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
  PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-fake}
  ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
  ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-false}
  SMS_BACKEND: ${SMS_BACKEND:-apps.notifications.sms.ConsoleSmsBackend}
  KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
  KAVENEGAR_OTP_TEMPLATE: ${KAVENEGAR_OTP_TEMPLATE:-verify}
  SMSIR_API_KEY: ${SMSIR_API_KEY:-}
  SMSIR_OTP_TEMPLATE_ID: ${SMSIR_OTP_TEMPLATE_ID:-0}
  SMSIR_LINE_NUMBER: ${SMSIR_LINE_NUMBER:-}
  AWS_STORAGE_BUCKET_NAME: media
  AWS_S3_ENDPOINT_URL: http://minio:9000
  AWS_S3_CUSTOM_DOMAIN: ${DOMAIN}/media
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  PRIVATE_MEDIA_ROOT: /app/private_media
  SENTRY_DSN: ${SENTRY_DSN:-}

x-backend-build: &backend-build
  context: ../backend
  args:
    PY_IMAGE: ${PY_IMAGE:-python:3.12-slim}
    PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    APT_MIRROR: ${APT_MIRROR:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: { POSTGRES_DB: "${POSTGRES_DB}", POSTGRES_USER: "${POSTGRES_USER}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}" }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"], interval: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: "${MINIO_ROOT_USER}", MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}" }
    volumes: [miniodata:/data]

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on: [minio]
    environment: { MINIO_ROOT_USER: "${MINIO_ROOT_USER}", MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}" }
    # public bucket for photos/logos: anonymous GetObject only (no listing). Medical files never go here.
    entrypoint: >
      sh -c "sleep 5 && mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
             mc mb -p local/media &&
             echo '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"AWS\":[\"*\"]},\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::media/*\"]}]}' > /tmp/p.json &&
             mc anonymous set-json /tmp/p.json local/media"

  backend:
    build: *backend-build
    restart: unless-stopped
    entrypoint: ["sh", "/app/entrypoint.sh"]
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "4", "--timeout", "60", "--access-logfile", "-"]
    environment:
      <<: *backend-env
      SEED_FAKE_DATA: ${SEED_FAKE_DATA:-false}
    volumes: [privatemedia:/app/private_media]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }

  celery-worker:
    build: *backend-build
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency", "4"]
    environment: *backend-env
    volumes: [privatemedia:/app/private_media]
    depends_on: [backend]

  celery-beat:
    build: *backend-build
    restart: unless-stopped
    command: ["celery", "-A", "config", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    environment: *backend-env
    depends_on: [backend]

  frontend:
    build:
      context: ../frontend
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        NEXT_PUBLIC_BRAND_NAME: ${BRAND_NAME}
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
        NEXT_PUBLIC_SUPPORT_PHONE: ${SUPPORT_PHONE}
        NEXT_PUBLIC_STAGING: ${STAGING:-false}
        NEXT_PUBLIC_DEMO_MODE: ${SEED_FAKE_DATA:-false}
        NEXT_PUBLIC_ICE_SERVERS: '[{"urls":"stun:${DOMAIN}:3478"},{"urls":"turn:${DOMAIN}:3478?transport=udp","username":"${TURN_USER}","credential":"${TURN_PASSWORD}"},{"urls":"turn:${DOMAIN}:3478?transport=tcp","username":"${TURN_USER}","credential":"${TURN_PASSWORD}"}]'
    restart: unless-stopped
    environment: { API_INTERNAL_URL: "http://backend:8000" }
    depends_on: [backend]

  # TURN relay for in-browser phone/video consultations (many networks block direct WebRTC)
  coturn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    network_mode: host
    command: >
      -n --listening-port=3478 --fingerprint --lt-cred-mech
      --user=${TURN_USER}:${TURN_PASSWORD} --realm=${DOMAIN}
      --min-port=49160 --max-port=49200 --no-cli --no-tls --no-dtls
      --no-multicast-peers --denied-peer-ip=10.0.0.0-10.255.255.255 --denied-peer-ip=172.16.0.0-172.31.255.255
      --denied-peer-ip=192.168.0.0-192.168.255.255

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
      # "off" in production; any text enables the username/password prompt (staging)
      BASIC_AUTH: ${BASIC_AUTH:-off}
      ROBOTS_TAG: ${ROBOTS_TAG:-all}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/htpasswd:/etc/nginx/htpasswd:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    # reload every 6h so renewed certificates are picked up
    command: ["/bin/sh", "-c", "while :; do sleep 6h; nginx -s reload; done & /docker-entrypoint.sh nginx -g 'daemon off;'"]
    depends_on: [frontend, backend]

  certbot:
    image: certbot/certbot:v3.0.1
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: { PGHOST: postgres, PGUSER: "${POSTGRES_USER}", PGPASSWORD: "${POSTGRES_PASSWORD}", PGDATABASE: "${POSTGRES_DB}", KEEP_DAYS: "14" }
    volumes: ["./backup.sh:/backup.sh:ro", "./backups:/backups"]
    entrypoint: ["sh", "-c", "while true; do sh /backup.sh; sleep 86400; done"]
    depends_on: { postgres: { condition: service_healthy } }

volumes:
  pgdata:
  redisdata:
  miniodata:
  privatemedia:
