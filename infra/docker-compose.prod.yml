# Production stack behind nginx (TLS). Usage:
#   cp infra/.env.example infra/.env   # fill secrets
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env up -d --build
name: doctor-platform

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.prod
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  DJANGO_ALLOWED_HOSTS: ${DOMAIN},www.${DOMAIN},backend
  BRAND_NAME: ${BRAND_NAME}
  SITE_URL: https://${DOMAIN}
  API_URL: https://${DOMAIN}
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CORS_ALLOWED_ORIGINS: https://${DOMAIN}
  CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
  JWT_COOKIE_SECURE: "true"
  JWT_COOKIE_DOMAIN: ${JWT_COOKIE_DOMAIN:-}
  PAYMENT_GATEWAY: ${PAYMENT_GATEWAY}
  ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID}
  ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX}
  SMS_BACKEND: ${SMS_BACKEND}
  KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY}
  KAVENEGAR_OTP_TEMPLATE: ${KAVENEGAR_OTP_TEMPLATE}
  SMSIR_API_KEY: ${SMSIR_API_KEY:-}
  SMSIR_OTP_TEMPLATE_ID: ${SMSIR_OTP_TEMPLATE_ID:-0}
  SMSIR_LINE_NUMBER: ${SMSIR_LINE_NUMBER:-}
  AWS_STORAGE_BUCKET_NAME: media
  AWS_S3_ENDPOINT_URL: http://minio:9000
  AWS_S3_CUSTOM_DOMAIN: ${DOMAIN}/media
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  SENTRY_DSN: ${SENTRY_DSN:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: { POSTGRES_DB: "${POSTGRES_DB}", POSTGRES_USER: "${POSTGRES_USER}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}" }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"], interval: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: "${MINIO_ROOT_USER}", MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}" }
    volumes: [miniodata:/data]

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on: [minio]
    entrypoint: >
      sh -c "sleep 5 && mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
             mc mb -p local/media && mc anonymous set download local/media"
    environment: { MINIO_ROOT_USER: "${MINIO_ROOT_USER}", MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}" }

  backend:
    build: ../backend
    restart: unless-stopped
    entrypoint: ["sh", "/app/entrypoint.sh"]
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "4", "--timeout", "60", "--access-logfile", "-"]
    environment: *backend-env
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }

  celery-worker:
    build: ../backend
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency", "4"]
    environment: *backend-env
    depends_on: [backend]

  celery-beat:
    build: ../backend
    restart: unless-stopped
    command: ["celery", "-A", "config", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    environment: *backend-env
    depends_on: [backend]

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_BRAND_NAME: ${BRAND_NAME}
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
        NEXT_PUBLIC_SUPPORT_PHONE: ${SUPPORT_PHONE}
        NEXT_PUBLIC_ICE_SERVERS: '[{"urls":"stun:${DOMAIN}:3478"},{"urls":"turn:${DOMAIN}:3478","username":"${TURN_USER}","credential":"${TURN_PASSWORD}"}]'
    restart: unless-stopped
    environment: { API_INTERNAL_URL: "http://backend:8000" }
    depends_on: [backend]

  # TURN relay for in-browser phone/video consultations (many mobile networks block direct WebRTC)
  coturn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    network_mode: host
    command: >
      -n --listening-port=3478 --fingerprint --lt-cred-mech
      --user=${TURN_USER}:${TURN_PASSWORD} --realm=${DOMAIN}
      --min-port=49160 --max-port=49200 --no-cli --no-tls --no-dtls

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN}" }
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: [frontend, backend]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: { PGHOST: postgres, PGUSER: "${POSTGRES_USER}", PGPASSWORD: "${POSTGRES_PASSWORD}", PGDATABASE: "${POSTGRES_DB}", KEEP_DAYS: "14" }
    volumes: ["./backup.sh:/backup.sh:ro", "./backups:/backups"]
    entrypoint: ["sh", "-c", "while true; do sh /backup.sh; sleep 86400; done"]
    depends_on: { postgres: { condition: service_healthy } }

volumes:
  pgdata:
  redisdata:
  miniodata:
