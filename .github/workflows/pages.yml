# Publishes the showcase page (site/ + docs/images) to GitHub Pages:
#   https://kasrajo06-oss.github.io/nobatino-platform/
# One-time setup: Settings → Pages → Source: "GitHub Actions".
# The live-demo button points to the repository variable DEMO_URL (Settings → Secrets and variables → Actions → Variables).
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/images/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        env:
          DEMO_URL: ${{ vars.DEMO_URL }}
        run: |
          mkdir -p _site/images
          cp site/* _site/
          cp docs/images/*.png _site/images/
          if [ -n "$DEMO_URL" ]; then sed -i "s|__DEMO_URL__|${DEMO_URL}|" _site/index.html; fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
